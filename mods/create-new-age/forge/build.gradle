repositories {
    maven { url "https://maven.neoforged.net/" }
}

dependencies {
    compileOnly(project(":common"))
    forge("net.neoforged:forge:${rootProject.forgeVersion}")

    modImplementation("com.simibubi.create:create-${rootProject.minecraftVersion}:${rootProject.createVersion}:slim") { transitive = false }
    modApi("com.tterrag.registrate:Registrate:${rootProject.registrateVersion}")
    compileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraftVersion}:${flywheelVersion}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraftVersion}:${flywheelVersion}")
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraftVersion}:${ponderVersion}")

    modRuntimeOnly("maven.modrinth:createaddition:1.20.1-1.3.0")

    compileOnly("io.github.llamalad7:mixinextras-common:0.4.1")
    annotationProcessor(implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1")))
}

processResources {
    from(project(":common").sourceSets.main.resources)
    inputs.property "version", project.version
    inputs.property "minecraftVersion", rootProject.minecraftVersion
    inputs.property "forgeVersionRange", project.forgeVersionRange
    inputs.property "eslVersion", project.eslVersion
    inputs.property "createVersion", project.createVersionShort

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
        "minecraftVersion": rootProject.minecraftVersion,
        "forgeVersionRange": project.forgeVersionRange,
        "eslVersion": project.eslVersion,
        "createVersion": project.createVersionShort
    }
}

compileJava {
    source(project(":common").sourceSets.main.allSource)
}

var modId = rootProject.modId

loom {
    forge {
        convertAccessWideners = true
        mixinConfigs(
                "create_new_age-common.mixins.json",
                "create_new_age-forge.mixins.json",
                "create.mixins.json"
        )
        runs {
            client {
                property("mixin.env.remapRefMap", "true")
                property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
            }
        }
    }
    
    runs {
        datagen {
            data()
            programArgs("--all", "--mod", "${modId}")
            programArgs("--output", file("src/generated/resources").absolutePath)
            programArgs("--existing", file("../common/src/main/resources").absolutePath)
        }
    }
}